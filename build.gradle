buildscript {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }

    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.17.17'
        classpath 'com.google.code.gson:gson:2.10.1'
    }

    configurations.classpath {
        resolutionStrategy.force 'com.google.code.gson:gson:2.10.1'
    }
}

plugins {
    id 'maven-publish'
}

apply plugin: 'fabric-loom'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
    maven { name = 'Conczin'; url = 'https://maven.conczin.net/Artifacts' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    /*
     * MCA Reborn 7.7.10 for 1.21.1 is a Fabric jar, not the old 1.20.1 universal jar.
     * Put mca-fabric-7.7.10+1.21.1.jar in /libs.
     */
    modImplementation files("libs/mca-fabric-${mca_version}.jar")
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_license', mod_license
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_description', mod_description

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand(
                version: project.version,
                mod_id: mod_id,
                mod_name: mod_name,
                mod_license: mod_license,
                mod_authors: mod_authors,
                mod_description: mod_description
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    from('LICENSE') {
        rename { "${it}_${mod_id}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/mcmodsrepo"
        }
    }
}